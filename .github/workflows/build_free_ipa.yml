name: Build Free iOS IPA (No Paid Apple Account)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4

      - name: "🐦 Setup Flutter"
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.x"
          channel: "stable"
          cache: true

      - name: "🏗️ Generate full Flutter iOS scaffold"
        run: |
          flutter create . --project-name locket_app --platforms ios,android
          echo "Scaffold OK!"

      - name: "📦 Install Flutter Dependencies"
        run: flutter pub get

      - name: "🔨 Build iOS Release (no codesign)"
        run: flutter build ios --release --no-codesign

      - name: "📦 Package .ipa file"
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r -q locket_app.ipa Payload
          echo "locket_app.ipa created!"

      - name: "🚀 Upload .ipa to GitHub Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: locket-app-ipa
          path: build/ios/iphoneos/locket_app.ipa
          retention-days: 14
