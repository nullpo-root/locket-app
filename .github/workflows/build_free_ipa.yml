name: Build Free iOS IPA (No Paid Apple Account)

on:
  push:
    branches:
      - main
  workflow_dispatch: # Cho phép bấm nút "Run workflow" trên giao diện GitHub bất kỳ lúc nào

jobs:
  build-ipa:
    runs-on: macos-14 # Máy Mac M1/M2 miễn phí của GitHub
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      - name: 🔨 Build iOS Release (Bỏ qua ký số)
        run: flutter build ios --release --no-codesign

      - name: 📦 Đóng gói file .ipa chuẩn
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r -q locket_app.ipa Payload
          echo "Đã tạo thành công file locket_app.ipa!"

      - name: 🚀 Tải file .ipa lên GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: locket-app-ipa
          path: build/ios/iphoneos/locket_app.ipa
          retention-days: 14
